{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc, #eef2ff 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #0f172a;
        }
        .panel {
            width: min(560px, calc(100vw - 32px));
            background: white;
            border: 1px solid #dfe7f1;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
            padding: 32px 28px;
            text-align: center;
        }
        .icon { font-size: 52px; margin-bottom: 14px; }
        h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 3vw, 2.3rem); }
        p { margin: 0 0 22px; color: #475569; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0f766e, #2563eb);
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="icon">🔒</div>
        <h1>Access Restricted</h1>
        <p>{{ message|default:"You don't have permission to view this page." }}</p>
        <a class="btn" href="{% url 'upload_dataset' %}">Return to Dashboard</a>
    </div>
</body>
</html>
